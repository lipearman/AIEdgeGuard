# edge-ai — AI orchestration stack (FastAPI agents)
#
# Reuses the EXISTING host Ollama (Windows service on port 11434).
# Do NOT create a second Ollama container — two instances would fight
# over the RTX 2060's 12GB VRAM.
#
# Prerequisite: the EdgeGuard gateway stack must be running first
# (C:\Docker\gateway\) — it owns the gateway_net network that this
# stack joins to reach CrowdSec LAPI and PostgreSQL/pgvector.
#
# Host Ollama hardening before using Qwen3.5 9B (Windows):
#   setx OLLAMA_MAX_LOADED_MODELS 1     (then restart Ollama from tray)

services:
  api:
    build: ./api
    container_name: edge-ai-api
    restart: unless-stopped
    environment:
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      CROWDSEC_LAPI_URL: ${CROWDSEC_LAPI_URL}
      CROWDSEC_MACHINE_ID: ${CROWDSEC_MACHINE_ID}
      CROWDSEC_MACHINE_PASSWORD: ${CROWDSEC_MACHINE_PASSWORD}
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY}
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      DETECTION_ENABLED: ${DETECTION_ENABLED:-true}
      DECIDE_ENABLED: ${DECIDE_ENABLED:-true}
      DEFENSE_AUTO_EXECUTE: ${DEFENSE_AUTO_EXECUTE:-false}
      DEFENSE_ENABLED: ${DEFENSE_ENABLED:-false}
      ATTACK_ENABLED: ${ATTACK_ENABLED:-false}
      ATTACK_TARGET_ALLOWLIST: ${ATTACK_TARGET_ALLOWLIST:-juicelab.lab.local}
      ATTACKER_URL: ${ATTACKER_URL:-http://edge-attacker:8000}
      LEARNING_ENABLED: ${LEARNING_ENABLED:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text:latest}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
    extra_hosts:
      # lets the container reach the host Ollama service (Docker Desktop)
      - "host.docker.internal:host-gateway"
    ports:
      # local access only; 8099 because gateway traefik owns host 8080
      - "127.0.0.1:8099:8000"
    depends_on:
      - redis
    networks:
      - gateway_net
      - edge_web   # reach the attack-lab attacker container (Phase 8)

  redis:
    image: redis:7-alpine
    container_name: edge-ai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway_net

volumes:
  redis_data:

networks:
  # owned by the gateway stack (C:\Docker\gateway) — compose prefixes it with
  # its project name, so the real network is "gateway_gateway_net"
  gateway_net:
    name: gateway_gateway_net
    external: true
  edge_web:
    external: true

