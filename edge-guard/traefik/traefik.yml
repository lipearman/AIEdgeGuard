# EdgeGuard Gateway — Traefik static configuration (file-based, replaces env vars)
# Carried over from the CVAT traefik service + new gateway capabilities.

log:
  level: INFO
  format: json

accessLog:
  filePath: /var/log/traefik/access.log
  format: json
  fields:
    defaultMode: drop
    names:
      ClientHost: keep
      DownstreamContentSize: keep
      DownstreamStatus: keep
      Duration: keep
      RequestHost: keep
      RequestMethod: keep
      RequestPath: keep
      RequestPort: keep
      RequestProtocol: keep
      RouterName: keep
      StartUTC: keep

entryPoints:
  web:
    address: ":8080"
  pilot:
    address: ":80"
  pilotsecure:
    address: ":8443"

providers:
  docker:
    exposedByDefault: false
    network: cvat_cvat
  file:
    directory: /etc/traefik/rules

experimental:
  plugins:
    crowdsec-bouncer-traefik-plugin:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      # check latest: https://plugins.traefik.io/plugins/6335346ca4caa9ddeffda116/crowdsec-bouncer-traefik-plugin
      version: v1.3.5
