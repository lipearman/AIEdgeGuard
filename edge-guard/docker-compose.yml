# EdgeGuard Gateway — standalone Traefik + CrowdSec (extracted from CVAT stack)
# Created: 2026-11-12 migration from C:\Docker\cvat\docker-compose.yml (traefik service)
#
# Routing behavior after migration = IDENTICAL to before:
#   - same ports (8080, 28080, 8090), same env, same rule files (mounted from cvat dir)
#   - CVAT / agents-office / grafana / aitradinghunter routes keep working
# New capabilities:
#   - CrowdSec container (AppSec WAF + IP banning + LAPI for edge-ai)
#   - crowdsec middleware (crowdsec@docker) ready to attach per-route
#   - pilot entrypoints (:80, :8443) for new projects on edge_web network
# Rollback: see docs/gateway-migration.md in AIEdgeGuard repo

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: always
    ports:
      - "8080:8080"
      - "28080:8080"
      - "8090:8090"
      - "80:80" # entrypoint "pilot" — new projects
      - "8443:8443" # entrypoint "pilotsecure"
      # root-path funnel migrations (tailscaled on host connects to 127.0.0.1)
      - "127.0.0.1:18081:8091" # funnelroot10000
      - "127.0.0.1:18082:8092" # funnelroot443
      - "127.0.0.1:18083:8093" # funnelroot8443
      - "127.0.0.1:18084:8094" # funnelroot8445 — HTTPS for new projects
        # (:443 is taken by Tailscale on this machine)
    environment:
      # container env used by dynamic rule files ({{ env "CVAT_HOST" }} in grafana_conf.yml)
      CVAT_HOST: llm-server
      DJANGO_LOG_VIEWER_HOST: grafana
      DJANGO_LOG_VIEWER_PORT: "3000"
    labels:
      - traefik.enable=true
      # middleware "crowdsec" — attach to any router with:
      #   traefik.http.routers.<name>.middlewares=crowdsec@docker
      # (option names verified against plugin v1.3.5 source: pkg/configuration/configuration.go)
      - traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.enabled=true
      - traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.crowdseclapiurl=http://crowdsec:8080
      - traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.crowdseclapikey=${CROWDSEC_BOUNCER_KEY}
      - traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.crowdsecAppsecEnabled=true
      - traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.crowdsecAppsecHost=crowdsec:7422
      - traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.crowdsecAppsecFailureBlock=true
      - traefik.http.middlewares.crowdsec.plugin.crowdsec-bouncer-traefik-plugin.forwardedHeadersTrustedIps=127.0.0.1/32,172.16.0.0/12
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - C:/Docker/cvat/components/analytics/grafana_conf.yml:/etc/traefik/rules/grafana_conf.yml:ro
      - C:/Docker/cvat/components/analytics/agents-office.yml:/etc/traefik/rules/agents-office.yml:ro
      - ./traefik/dynamic/funnel.yml:/etc/traefik/rules/funnel.yml:ro
      - traefik_logs:/var/log/traefik
      - plugins_storage:/plugins-storage
    networks:
      - gateway_net
      - cvat_cvat
      - edge_web
      # upstreams for funnel ingress (external ERPNext/forgemind/insureai paths)
      - erpnext_frappe_network
      - insureai-llm_default
      - ai-gateway_default
      - forgemind_frontend
    logging:
      driver: "json-file"
      options:
        max-size: 100m
        max-file: "10"

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: gateway-crowdsec
    restart: always
    environment:
      # installed on every boot (files live on container fs, must re-install)
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules crowdsecurity/appsec-crs-inband"
      LOCAL_API_URL: http://crowdsec:8080
    volumes:
      # NOTE: destination must be acquis.yaml (CrowdSec reads exactly this filename)
      - ./crowdsec/acquis.yml:/etc/crowdsec/acquis.yaml:ro
      # custom merged appsec config (vpatch + generic + OWASP CRS)
      - ./crowdsec/custom-crs-full.yaml:/etc/crowdsec/appsec-configs/custom-crs-full.yaml:ro
      # never ban the gateway host itself (local probes -> XFF 100.99.80.84)
      - ./crowdsec/whitelist-edgeguard.yaml:/etc/crowdsec/parsers/s02-enrich/edgeguard-whitelist.yaml:ro
      # edgeguard custom appsec rules (vercel frontend allow rule)
      # DO NOT ENABLE: trusting Origin/Referer would let clients bypass the WAF.
      # - ./crowdsec/appsec-rules-edgeguard/:/etc/crowdsec/appsec-rules/edgeguard:ro
      - crowdsec_db:/var/lib/crowdsec/data
      - traefik_logs:/var/log/traefik:ro
    # LAPI/AppSec published on the TAILSCALE IP ONLY (100.99.80.84) — reachable
    # by host processes (sanuk-traefik plugin) AND tailnet devices. Both
    # endpoints require keys. Loopback-only publish breaks after WSL restarts
    # on this machine (wslrelay conflict), so we bind the TS interface instead.
    ports:
      - "100.99.80.84:8085:8080"
      - "100.99.80.84:8086:7422"
    # No other published ports: AppSec (7422) reachable only inside gateway_net
    networks:
      - gateway_net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: gateway-postgres
    restart: always
    environment:
      POSTGRES_DB: edgeguard
      POSTGRES_USER: edgeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeguard -d edgeguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway_net

volumes:
  traefik_logs:
  plugins_storage:
  crowdsec_db:
  postgres_data:

networks:
  # explicit subnet: docker's default address pools are exhausted on this machine
  gateway_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.210.2.0/24
  cvat_cvat:
    external: true
  edge_web:
    external: true
  erpnext_frappe_network:
    external: true
  insureai-llm_default:
    external: true
  ai-gateway_default:
    external: true
  forgemind_frontend:
    external: true
