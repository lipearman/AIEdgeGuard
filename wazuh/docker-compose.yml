# EdgeGuard — Wazuh Manager ONLY (RAM-aware Phase 3)
#
# ให้ detection rules + alerts + enrollment + API — หัวใจของ Wazuh โดยไม่ต้องรัน
# indexer/dashboard (SIEM UI หนัก 2-4GB RAM — เลื่อนไปเมื่อ RAM ว่าง)
# RAM budget: mem_limit 1g (เครื่องเหลือ ~1.5GB ณ ตอน deploy)
#
# ตัดสินใจย้อนหลัง: ถ้า RAM ว่าง (เช่นหลังปิด tts-spark/nuclio-sam) ให้เพิ่ม
# wazuh-indexer + dashboard ตาม single-node compose ใน wazuh-docker repo
#
# API: http://127.0.0.1:55000 (default wazuh/wazuh — เปลี่ยนรหัสหลัง deploy!)

services:
  wazuh-manager:
    image: wazuh/wazuh-manager:4.14.5
    container_name: edgeguard-wazuh-manager
    hostname: wazuh.manager
    restart: unless-stopped
    ports:
      - "0.0.0.0:1514:1514/tcp"     # agent events (Windows agent เรียกเข้า)
      - "0.0.0.0:1515:1515/tcp"     # enrollment
      - "100.99.80.84:55000:55000" # Wazuh API — tailnet only (auth required)
    volumes:
      - wazuh_manager_data:/var/ossec/data
      - wazuh_manager_etc:/var/ossec/etc
      - wazuh_manager_logs:/var/ossec/logs
    mem_limit: 1g

volumes:
  wazuh_manager_data:
  wazuh_manager_etc:
  wazuh_manager_logs:
